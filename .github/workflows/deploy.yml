# ilobrowser.com, deployed to Cloudflare (wrangler.jsonc) on every push to main, after the checks.
# release.yml calls it with the commit it made, since a push by GitHub's own token starts no
# workflow. CLOUDFLARE_API_TOKEN is a token with Workers Scripts Edit on the account, and
# CLOUDFLARE_ACCOUNT_ID the account's ID.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: The commit to deploy
        type: string
        required: true
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

# One deploy at a time, and a newer commit's replaces one still waiting.
concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true

      - run: vp check
      - run: vp test
      - run: vp build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.151.2 deploy
